name: Phase 4C Stage 1B.6J-R3 OpenBLAS runtime

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-audit-relocate:
    name: Resolve, audit, build, and relocate Windows OpenBLAS runtime
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - name: Check out the exact dispatched commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Bootstrap isolated Miniforge builder
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniforge-version: latest
          activate-environment: phase4c_r3_builder
          python-version: "3.12"
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true
          auto-activate-base: false

      - name: Install conda-pack in builder only
        shell: pwsh
        run: >-
          conda install --yes --name phase4c_r3_builder
          --strict-channel-priority --override-channels --channel conda-forge
          conda-pack

      - name: Build and validate exact OpenBLAS candidate
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: >-
          & "${{ github.workspace }}\tools\ipopt_r3_builder\build_r3_openblas.ps1"
          -OutputDirectory "${{ github.workspace }}\phase4c_stage1b6j_r3_artifact"
          -ScientificPayload "${{ github.workspace }}\tools\ipopt_r3_builder\phase4c_stage1b6j_r3_scientific_payload.zip"

      - name: Upload only the fully validated runtime artifact
        if: ${{ success() }}
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase4c-stage1b6j-r3-openblas-runtime
          path: phase4c_stage1b6j_r3_artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record uploaded artifact digest
        if: ${{ success() }}
        shell: pwsh
        run: Write-Output "artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
