name: Build Phase 4C Ipopt bootstrap bundle

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64-bundle:
    name: Build and relocate Windows x64 Ipopt bundle
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out infrastructure source
        uses: actions/checkout@v4

      - name: Bootstrap Miniforge on the GitHub-hosted runner
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true
          auto-activate: false

      - name: Expose Miniforge conda executable to PowerShell
        shell: pwsh
        run: |
          if (-not $env:CONDA) {
            throw 'setup-miniconda did not provide the CONDA installation root.'
          }
          $condaExe = Join-Path $env:CONDA 'Scripts\conda.exe'
          if (-not (Test-Path -LiteralPath $condaExe -PathType Leaf)) {
            throw "Expected conda.exe was not found at: $condaExe"
          }
          (Split-Path -Parent $condaExe) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Output "CONDA_EXE=$condaExe"

      - name: Build, smoke-test, pack, relocate, and verify bundle
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: >-
          & "${{ github.workspace }}\tools\ipopt_bundle_builder\build_bundle.ps1"
          -OutputDirectory "${{ github.workspace }}\ipopt_bundle_output"

      - name: Upload verified offline transfer bundle
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase4c-stage1b6f-ipopt-env-bundle
          path: |
            ipopt_bundle_output/phase4c_stage1b6f_ipopt_env_bundle.zip
            ipopt_bundle_output/phase4c_stage1b6f_ipopt_env_bundle.zip.sha256.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
